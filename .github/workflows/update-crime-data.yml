# Checks Police.uk every day for a new month of crime data. When there is one,
# downloads the archive, converts the new months, recomputes the statistics and
# commits the result; the push to master then triggers the Vercel deploy.
#
# Most days this finishes in seconds ("up to date"). Run it by hand from the
# Actions tab with "Run workflow".

name: Update crime data

on:
  schedule:
    - cron: '17 6 * * *' # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

# Never let two runs write data at the same time
concurrency:
  group: update-crime-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: data_processing

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: data_processing/package-lock.json

      - name: Install
        run: npm ci

      - name: Check Police.uk and add any new months
        run: npm run update-data

      - name: Commit new data
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new data."
            exit 0
          fi

          months=$(git status --porcelain -- ../front_end/public/data/crime \
            | grep -o '[0-9]\{4\}-[0-9]\{2\}' | sort | paste -sd ',' - | sed 's/,/, /g')

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A ..
          git commit -m "data: add Police.uk crime data for ${months}"
          git pull --rebase
          git push
